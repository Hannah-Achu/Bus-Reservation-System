<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Search Journey</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='api.js') }}"></script>
</head>
<body>
   <header class="top-nav">
    <div class="nav-left">
        <span class="back-arrow" onclick="history.back()">&#8592;</span> <span class="brand">TransitFlow</span>
    </div>
    <div class="user-profile">
        <span class="user-emoji" onclick="location.href='/login'">👤</span> 
    </div>
</header>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h1>Your Journey Awaits</h1>
                <p>Reliable bus travel across the country, booked in seconds.</p>
            </div>
            
            <div class="search-bar">
                <div class="search-input">
                    <label><i class="far fa-circle"></i> From</label>
                    <input type="text" id="origin" placeholder="e.g. Palakkad">
                </div>
                <div class="search-input border-left">
                    <label><i class="fas fa-map-marker-alt"></i> To</label>
                    <input type="text" id="destination" placeholder="e.g. Kochi">
                </div>
                <div class="search-input border-left">
                    <label><i class="far fa-calendar"></i> Travel Date</label>
                    <input type="date" id="travelDate">
                </div>
                <button class="btn-search" id="searchBtn">
                    <i class="fas fa-search"></i> Search Buses
                </button>
            </div>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h2>Available Buses</h2>
                <span id="resultCount">Enter details to search</span>
            </div>

            <div id="busResultsContainer">
                </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="trips.html" class="nav-item"><i class="fas fa-ticket-alt"></i><span>My Trips</span></a>
        <a href="login.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('travelDate').value;

            if (!origin || !destination) {
                alert("Please enter both Origin and Destination");
                return;
            }

            try {
                const results = await searchSchedules(origin, destination, date);
                const container = document.getElementById('busResultsContainer');
                const countSpan = document.getElementById('resultCount');
                
                container.innerHTML = ''; // Clear previous results
                countSpan.innerText = `${results.length} results found`;

                if (results.length === 0) {
                    container.innerHTML = '<p style="text-align:center; padding: 20px;">No buses found for this route.</p>';
                    return;
                }

                results.forEach(bus => {
                    // Create a dynamic card for each bus found in MySQL
                    const busCard = `
                        <div class="bus-card">
                            <div class="bus-info">
                                <div class="bus-details">
                                    <span class="bus-name">${bus.bus_number} (${bus.route})</span>
                                    <span class="bus-type">${bus.bus_type}</span>
                                </div>
                                <div class="price">₹${bus.fare}</div>
                            </div>
                            <div class="timeline">
                                <div class="time-point">
                                    <strong>${new Date(bus.departure).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</strong>
                                    <span>${origin}</span>
                                </div>
                                <div class="duration-line">
                                    <span>Available: ${bus.available_seats}</span>
                                    <div class="line"></div>
                                    <i class="fas fa-bus"></i>
                                </div>
                            </div>
                            <button class="btn-select" onclick="location.href='/selection?schedule_id=${bus.schedule_id}&bus_id=${bus.bus_id || 1}'">Select</button>
                        </div>
                    `;
                    container.innerHTML += busCard;
                });
            } catch (error) {
                console.error("Search failed:", error);
                alert("Search failed. Please ensure the backend server is running.");
            }
        });
    </script>
</body>
</html>
