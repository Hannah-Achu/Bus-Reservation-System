<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SwiftRide</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='api.js') }}"></script>
</head>
<body class="login-page">

    <header class="top-nav">
        <div class="nav-left">
            <span class="brand"><i class="fas fa-bus"></i> SwiftRide</span>
        </div>
        <div class="user-profile">
            <i class="fas fa-user-circle"></i>
        </div>
    </header>

    <main class="auth-center-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue your journey</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-flex">
                        <label>Password</label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="far fa-eye toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary-login">Sign In</button>
            </form>

            <p class="signup-footer" style="margin-top: 20px; text-align: center;">
                Don't have an account? <a href="/" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Create Account</a>
            </p>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // The login function in api.js handles the token storage and redirect to /index
                await login(email, password);
                
                // If you prefer to handle the alert here, you can.
                // alert("Login Successful!"); 

            } catch (error) {
                // Catches 401 Unauthorized or other network errors
                alert("Error: " + (error.message || "Login failed"));
            }
        });

        // Optional: Simple Password Toggle logic
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.getElementById('password');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.classList.toggle('fa-eye-slash');
            });
        }
    </script>

    <nav class="bottom-nav">
        <a href="/index" class="nav-item"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="/trips" class="nav-item"><i class="fas fa-ticket-alt"></i><span>My Trips</span></a>
        <a href="#" class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

</body>
</html>
