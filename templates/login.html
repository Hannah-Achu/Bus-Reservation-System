<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f8faff] font-sans min-h-screen pb-24">

    <header class="bg-white px-8 py-4 flex justify-between items-center border-b">
        <h1 class="text-blue-700 font-bold text-xl">TransitFlow</h1>
        <div class="text-gray-400 text-2xl cursor-pointer" onclick="location.href='/profile'">
            <i class="fa-regular fa-circle-user"></i>
        </div>
    </header>

    <main class="max-w-md mx-auto p-6 md:p-10">

        <!-- Hero Image -->
        <div class="relative rounded-2xl overflow-hidden h-48 shadow-lg mb-6">
            <img src="/static/assets/bus-bg.jpeg" alt="Bus" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/30 flex flex-col justify-end p-6">
                <h2 class="text-white font-bold text-2xl">Reliable Travel.</h2>
                <p class="text-white/80 text-sm">Seamless bookings for every journey.</p>
            </div>
        </div>

        <!-- Login Card -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-xl font-bold text-gray-800 mb-6">Welcome Back</h3>

            <!-- Error message -->
            <div id="loginError" class="hidden mb-4 bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg border border-red-200">
                <i class="fa-solid fa-circle-exclamation mr-2"></i>
                <span id="loginErrorMsg">Invalid email or password.</span>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email</label>
                    <input id="loginEmail" type="email" placeholder="email@transitflow.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                    <div class="relative">
                        <input id="loginPassword" type="password" placeholder="••••••••"
                               class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <button type="button" onclick="togglePassword()"
                                class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button id="loginBtn" type="button" onclick="handleLogin()"
                        class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition shadow-md flex items-center justify-center gap-2">
                    <span>Login</span>
                    <i id="loginSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>

                <div class="flex justify-between text-xs mt-4">
                    <p class="text-gray-500">New here?
                        <a href="/" class="text-blue-600 font-bold hover:underline">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Trust badges -->
        <div class="grid grid-cols-3 gap-4 mt-8">
            <div class="flex flex-col items-center text-center">
                <i class="fa-solid fa-shield-halved text-teal-500 mb-2"></i>
                <span class="text-[10px] font-bold text-gray-700">Secure Payment</span>
            </div>
            <div class="flex flex-col items-center text-center">
                <i class="fa-solid fa-headset text-teal-500 mb-2"></i>
                <span class="text-[10px] font-bold text-gray-700">24/7 Support</span>
            </div>
            <div class="flex flex-col items-center text-center">
                <i class="fa-solid fa-calendar-check text-teal-500 mb-2"></i>
                <span class="text-[10px] font-bold text-gray-700">Easy Refunds</span>
            </div>
        </div>

    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full py-3 flex justify-around items-center z-50">
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600 transition"
             onclick="location.href='/search'">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] mt-1">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-blue-600 cursor-pointer"
             onclick="location.href='/profile'">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">PROFILE</span>
        </div>
    </nav>

    <script src="/static/js/api.js"></script>
    <script>

        // ── If already logged in, skip login page ─────────────────────
        (function checkAuth() {
            if (getToken()) {
                // Check if there's a page they were trying to visit
                const redirect = sessionStorage.getItem("redirectAfterLogin") || "/search";
                sessionStorage.removeItem("redirectAfterLogin");
                window.location.href = redirect;
            }
        })();

        // ── Show/hide password ────────────────────────────────────────
        function togglePassword() {
            const input   = document.getElementById("loginPassword");
            const icon    = document.getElementById("eyeIcon");
            const isHidden = input.type === "password";
            input.type    = isHidden ? "text" : "password";
            icon.className = isHidden ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
        }

        // ── Handle login ──────────────────────────────────────────────
        async function handleLogin() {
            const email    = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const errBox   = document.getElementById("loginError");
            const errMsg   = document.getElementById("loginErrorMsg");
            const spinner  = document.getElementById("loginSpinner");
            const btn      = document.getElementById("loginBtn");

            errBox.classList.add("hidden");

            if (!email || !password) {
                errMsg.textContent = "Please enter your email and password.";
                errBox.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            spinner.classList.remove("hidden");

            try {
                await login(email, password);   // from api.js — saves token + user
                // Redirect to where they came from, or profile by default
                const redirect = sessionStorage.getItem("redirectAfterLogin") || "/profile";
                sessionStorage.removeItem("redirectAfterLogin");
                window.location.href = redirect;
            } catch (err) {
                errMsg.textContent = err?.error || err?.message || "Invalid email or password.";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                spinner.classList.add("hidden");
            }
        }

        // ── Allow Enter key to submit ─────────────────────────────────
        ["loginEmail", "loginPassword"].forEach(id => {
            document.getElementById(id)?.addEventListener("keydown", e => {
                if (e.key === "Enter") handleLogin();
            });
        });

    </script>
</body>
</html>
