<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - TransitFlow</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="trips-page">

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="back-arrow"><i class="fas fa-arrow-left"></i></a> 
            <span class="brand">TransitFlow</span>
        </div>
        <div class="user-profile">
            <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img">
        </div>
    </header>

    <main class="container">
        <section class="upcoming-trip">
            <p class="section-label">UPCOMING TRIP</p>
            <div class="header-flex">
                <h1 class="main-title">Active Ticket</h1>
                <button class="download-btn"><i class="fas fa-download"></i> Download</button>
            </div>

            <div class="ticket-card">
                <div class="ticket-top">
                    <div class="pnr-info">
                        <span>PNR NUMBER</span>
                        <h2>TF9428</h2>
                    </div>
                    <div class="qr-placeholder">
                        <i class="fas fa-qrcode"></i>
                    </div>
                </div>

                <div class="ticket-journey">
                    <div class="location">
                        <span>FROM</span>
                        <h3>San Francisco</h3>
                        <p>4th St Terminal</p>
                    </div>
                    <div class="bus-icon-wrap">
                        <i class="fas fa-bus"></i>
                    </div>
                    <div class="location text-right">
                        <span>TO</span>
                        <h3>Los Angeles</h3>
                        <p>Union Station</p>
                    </div>
                </div>

                <div class="ticket-footer">
                    <div class="meta-item">
                        <span>DATE</span>
                        <p>Oct 24, 2023</p>
                    </div>
                    <div class="meta-item text-right">
                        <span>TIME</span>
                        <p>08:30 AM</p>
                    </div>
                    <div class="meta-item">
                        <span>SEAT</span>
                        <p>14A (Window)</p>
                    </div>
                    <div class="meta-item text-right">
                        <span>BUS TYPE</span>
                        <p>Executive Sleeper</p>
                    </div>
                </div>
            </div>
        </section>

        
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="trips.html" class="nav-item active"><i class="fas fa-ticket-alt"></i><span>My Trips</span></a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

</body>
</html>
