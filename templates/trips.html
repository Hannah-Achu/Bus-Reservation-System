<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - TransitFlow</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='api.js') }}"></script>
</head>
<body class="trips-page">

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="back-arrow"><i class="fas fa-arrow-left"></i></a> 
            <span class="brand">TransitFlow</span>
        </div>
        <div class="user-profile">
            <a href="login.html" style="color: inherit;"><i class="fas fa-user-circle" style="font-size: 1.5rem;"></i></a>
        </div>
    </header>

    <main class="container">
        <section class="upcoming-trip">
            <p class="section-label">YOUR BOOKINGS</p>
            <div class="header-flex">
                <h1 class="main-title">Active Tickets</h1>
            </div>

            <div id="ticketsContainer">
                <p style="text-align: center; padding: 20px; color: #666;">Loading your trips...</p>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="trips.html" class="nav-item active"><i class="fas fa-ticket-alt"></i><span>My Trips</span></a>
        <a href="login.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        window.onload = async () => {
            const container = document.getElementById('ticketsContainer');
            
            try {
                // 1. Fetch bookings from backend (requires JWT token)
                const bookings = await myBookings();
                
                if (bookings.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px;">
                            <i class="fas fa-ticket-alt" style="font-size: 3rem; color: #ccc; margin-bottom: 10px;"></i>
                            <p>No active bookings found.</p>
                            <a href="index.html" class="btn-primary" style="display: inline-block; margin-top: 10px; text-decoration: none;">Book a Trip</a>
                        </div>`;
                    return;
                }

                container.innerHTML = ''; // Clear loading text

                bookings.forEach(ticket => {
                    // Create dynamic ticket card
                    const ticketHTML = `
                        <div class="ticket-card" id="ticket-${ticket.booking_id}" style="margin-bottom: 20px;">
                            <div class="ticket-top">
                                <div class="pnr-info">
                                    <span>PNR NUMBER</span>
                                    <h2>${ticket.pnr}</h2>
                                </div>
                                <div class="qr-placeholder">
                                    <i class="fas fa-qrcode"></i>
                                </div>
                            </div>

                            <div class="ticket-journey">
                                <div class="location">
                                    <span>ROUTE</span>
                                    <h3>${ticket.route}</h3>
                                    <p>Bus: ${ticket.bus}</p>
                                </div>
                                <div class="bus-icon-wrap">
                                    <i class="fas fa-bus"></i>
                                </div>
                                <div class="location text-right">
                                    <span>STATUS</span>
                                    <h3 style="color: #28a745;">Confirmed</h3>
                                    <p>Fare: ₹${ticket.total_fee}</p>
                                </div>
                            </div>

                            <div class="ticket-footer">
                                <div class="meta-item">
                                    <span>DATE & TIME</span>
                                    <p>${new Date(ticket.departure).toLocaleDateString()} | ${new Date(ticket.departure).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                </div>
                                <div class="meta-item text-right">
                                    <span>SEAT</span>
                                    <p>${ticket.seat_no} (${ticket.seat_type})</p>
                                </div>
                            </div>
                            
                            <button onclick="cancelTrip(${ticket.booking_id})" class="download-btn" style="width: 100%; margin-top: 10px; background-color: #ffebee; color: #c62828; border: none;">
                                <i class="fas fa-times"></i> Cancel Booking
                            </button>
                        </div>
                    `;
                    container.innerHTML += ticketHTML;
                });
            } catch (err) {
                console.error("Failed to load trips:", err);
                container.innerHTML = `
                    <p style="text-align: center; color: red; padding: 20px;">
                        Unable to load trips. Please ensure you are <a href="login.html">logged in</a>.
                    </p>`;
            }
        };

        async function cancelTrip(bookingId) {
            if (!confirm("Are you sure you want to cancel this booking?")) return;

            try {
                await cancelBooking(bookingId); // Function from api.js
                alert("Booking cancelled successfully.");
                location.reload(); // Refresh the list
            } catch (err) {
                alert("Cancellation failed: " + (err.error || "Server error"));
            }
        }
    </script>
</body>
</html>
