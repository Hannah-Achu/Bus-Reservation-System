<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Select Seats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f0f4f8] font-sans min-h-screen pb-20">

    <header class="bg-white px-8 py-4 flex justify-between items-center border-b sticky top-0 z-50">
        <h1 class="text-blue-700 font-bold text-xl">TransitFlow</h1>
        <div class="flex items-center gap-4">
            <button onclick="history.back()"
                    class="text-xs font-bold text-gray-500 hover:bg-gray-100 px-3 py-1 rounded transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </button>
            <div class="text-blue-600 text-2xl cursor-pointer" onclick="location.href='/profile'">
                <i class="fa-regular fa-circle-user"></i>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-6">

        <!-- Bus Info Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <h2 id="bus-number" class="text-xl font-bold text-gray-800">Loading...</h2>
                <p id="bus-type" class="text-xs text-gray-400 font-bold tracking-widest mt-1"></p>
                <div class="mt-3 flex items-center gap-2 text-sm text-gray-600">
                    <i class="fa-regular fa-clock text-blue-500"></i>
                    <span id="departure-time">--</span>
                </div>
                <p id="route-name" class="text-sm text-gray-500 mt-1">
                    <i class="fa-solid fa-route text-blue-400 mr-1"></i>
                </p>
            </div>
            <div class="text-right">
                <p id="fare" class="text-2xl font-bold text-blue-600">--</p>
                <p class="text-[10px] text-gray-400 font-bold">Per Seat</p>
            </div>
        </div>

        <!-- Legend -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-sm font-bold text-gray-700 mb-4">Seat Legend</p>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded"></div> Available
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-gray-200 rounded"></div> Booked
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-pink-100 border border-pink-300 rounded flex items-center justify-center text-pink-500">
                        <i class="fa-solid fa-venus text-[10px]"></i>
                    </div> Women Only
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-blue-400 rounded flex items-center justify-center text-blue-500">
                        <i class="fa-solid fa-wheelchair text-[10px]"></i>
                    </div> PWD
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-400 rounded"></div> Window
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-blue-600 rounded flex items-center justify-center text-white">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div> Selected
                </div>
            </div>
        </div>

        <!-- Seat Map -->
        <div class="bg-white rounded-[2.5rem] shadow-xl border border-gray-100 max-w-sm mx-auto overflow-hidden">
            <div class="bg-gray-100 p-6 flex justify-between items-center border-b border-gray-200">
                <div class="w-10 h-10 rounded-full border-4 border-gray-400 flex items-center justify-center">
                    <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                </div>
                <span class="text-[10px] font-bold text-gray-400 tracking-widest">FRONT</span>
            </div>

            <!-- Seats rendered here -->
            <div id="seat-grid" class="p-8 grid grid-cols-4 gap-x-4 gap-y-6 place-items-center">
                <p class="col-span-4 text-gray-400 text-sm text-center py-6">
                    <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading seats...
                </p>
            </div>

            <div class="flex justify-center pb-8">
                <div class="w-24 h-2 bg-gray-100 rounded-full"></div>
            </div>
        </div>

        <!-- Booking Summary (hidden until seat is selected) -->
        <div id="booking-summary" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-sm font-bold text-gray-700 mb-4">Booking Summary</h3>
            <div class="space-y-2 mb-4">
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Route</span>
                    <span id="summary-route" class="font-bold text-gray-800">--</span>
                </div>
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Selected Seat</span>
                    <span id="summary-seat" class="font-bold text-gray-800">--</span>
                </div>
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Seat Type</span>
                    <span id="summary-type" class="font-bold text-gray-800">--</span>
                </div>
                <div class="flex justify-between text-sm text-gray-600 pt-2 border-t border-gray-100">
                    <span>Total Fare</span>
                    <span id="summary-fare" class="font-bold text-blue-600 text-lg">--</span>
                </div>
            </div>
            <button onclick="handleBooking()"
                    id="confirm-btn"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                Confirm Booking
            </button>
            <div id="booking-message" class="hidden text-center text-sm mt-3 py-2 px-4 rounded-lg"></div>
        </div>

    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full py-3 flex justify-around items-center z-50">
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600 transition"
             onclick="location.href='/search'">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] mt-1">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600 transition"
             onclick="location.href='/profile'">
            <i class="fa-regular fa-user text-xl"></i>
            <span class="text-[10px] mt-1">PROFILE</span>
        </div>
    </nav>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>

        // ── Auth check ────────────────────────────────────────────────
        (function checkAuth() {
            if (!getToken()) {
                sessionStorage.setItem("redirectAfterLogin", window.location.href);
                window.location.href = "/login";
            }
        })();

        // ── Read schedule_id and bus_id from URL ──────────────────────
        const params     = new URLSearchParams(window.location.search);
        const scheduleId = parseInt(params.get("schedule_id"));
        const busId      = parseInt(params.get("bus_id"));

        // ── Track selected seat ───────────────────────────────────────
        let selectedSeatId   = null;
        let selectedSeatNo   = null;
        let selectedSeatType = null;
        let currentFare      = 0;
        let currentRoute     = "";

        // ── Load page data on start ───────────────────────────────────
        window.addEventListener("load", async () => {
            if (!scheduleId || !busId) {
                document.getElementById("seat-grid").innerHTML = `
                    <p class="col-span-4 text-red-400 text-sm text-center">
                        No schedule selected.
                        <a href="/search" class="underline text-blue-500">Go back to search</a>
                    </p>`;
                return;
            }
            await loadScheduleInfo();
            await loadSeats();
        });

        // ── Fetch and display schedule info ───────────────────────────
        async function loadScheduleInfo() {
            try {
                const res = await fetch(`/api/buses/schedule/${scheduleId}`);
                if (!res.ok) throw new Error("Schedule not found");
                const s = await res.json();

                document.getElementById("bus-number").textContent  = s.bus_number;
                document.getElementById("bus-type").textContent    = s.bus_type;
                document.getElementById("departure-time").textContent =
                    new Date(s.departure).toLocaleString("en-US", {
                        weekday: "short", month: "short", day: "numeric",
                        hour: "2-digit", minute: "2-digit"
                    });
                document.getElementById("route-name").innerHTML =
                    `<i class="fa-solid fa-route text-blue-400 mr-1"></i>${s.route}`;
                document.getElementById("fare").textContent = `₹${s.fare}`;
                currentFare  = s.fare;
                currentRoute = s.route;
            } catch (err) {
                document.getElementById("bus-number").textContent = "Could not load schedule";
                console.error(err);
            }
        }

        // ── Fetch and render seat grid ────────────────────────────────
        async function loadSeats() {
            const grid = document.getElementById("seat-grid");
            try {
                const seats = await getSeats(busId);
                if (!seats || seats.length === 0) {
                    grid.innerHTML = `<p class="col-span-4 text-gray-400 text-sm">No seats found for this bus.</p>`;
                    return;
                }
                grid.innerHTML = seats.map(seat => buildSeatButton(seat)).join("");
            } catch (err) {
                grid.innerHTML = `<p class="col-span-4 text-red-400 text-sm text-center">Failed to load seats. Please try again.</p>`;
                console.error(err);
            }
        }

        // ── Build individual seat button HTML ─────────────────────────
        function buildSeatButton(seat) {

            // Booked — grey block, not clickable
            if (seat.status === "Booked") {
                return `<div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center
                              justify-center text-gray-400 text-xs font-bold"
                             title="Booked">
                            ${seat.seat_no}
                        </div>`;
            }

            // Women only seat
            if (seat.restriction === "Women") {
                return `<button id="seat-${seat.seat_id}"
                            onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                            class="w-12 h-12 bg-pink-100 border border-pink-300 rounded-lg
                                   flex items-center justify-center text-pink-500
                                   hover:border-pink-500 transition"
                            title="Women only - ${seat.seat_no}">
                            <i class="fa-solid fa-venus"></i>
                        </button>`;
            }

            // PWD seat
            if (seat.restriction === "PWD") {
                return `<button id="seat-${seat.seat_id}"
                            onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                            class="w-12 h-12 border-2 border-blue-400 rounded-lg
                                   flex items-center justify-center text-blue-500
                                   hover:bg-blue-50 transition"
                            title="PWD - ${seat.seat_no}">
                            <i class="fa-solid fa-wheelchair"></i>
                        </button>`;
            }

            // Window seat
            if (seat.seat_type === "Window") {
                return `<button id="seat-${seat.seat_id}"
                            onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                            class="w-12 h-12 border-2 border-gray-400 rounded-lg
                                   text-xs font-bold text-gray-500
                                   hover:border-blue-500 hover:text-blue-600 transition"
                            title="Window - ${seat.seat_no}">
                            ${seat.seat_no}
                        </button>`;
            }

            // Standard available seat
            return `<button id="seat-${seat.seat_id}"
                        onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                        class="w-12 h-12 border-2 border-gray-300 rounded-lg
                               text-xs font-bold text-gray-500
                               hover:border-blue-500 hover:text-blue-600 transition"
                        title="${seat.seat_type} - ${seat.seat_no}">
                        ${seat.seat_no}
                    </button>`;
        }

        // ── Handle seat click ─────────────────────────────────────────
        function selectSeat(seatId, seatNo, seatType) {

            // Deselect previously selected seat
            if (selectedSeatId) {
                const prev = document.getElementById(`seat-${selectedSeatId}`);
                if (prev) {
                    prev.classList.remove("bg-blue-600", "text-white", "border-blue-600", "shadow-lg");
                    prev.classList.add("border-gray-300", "text-gray-500");
                    prev.innerHTML = selectedSeatNo;
                }
            }

            // Select new seat
            selectedSeatId   = seatId;
            selectedSeatNo   = seatNo;
            selectedSeatType = seatType;

            const btn = document.getElementById(`seat-${seatId}`);
            if (btn) {
                btn.classList.remove("border-gray-300", "border-gray-400",
                                     "border-blue-400", "border-pink-300",
                                     "text-gray-500", "text-blue-500", "text-pink-500");
                btn.classList.add("bg-blue-600", "text-white", "border-blue-600", "shadow-lg");
                btn.innerHTML = `<i class="fa-solid fa-check text-sm"></i>`;
            }

            // Show booking summary
            const summary = document.getElementById("booking-summary");
            summary.classList.remove("hidden");
            document.getElementById("summary-route").textContent = currentRoute;
            document.getElementById("summary-seat").textContent  = seatNo;
            document.getElementById("summary-type").textContent  = seatType;
            document.getElementById("summary-fare").textContent  = `₹${currentFare}`;

            // Hide any previous booking message
            const msgEl = document.getElementById("booking-message");
            msgEl.classList.add("hidden");

            // Scroll to summary
            summary.scrollIntoView({ behavior: "smooth" });
        }

        // ── Confirm booking ───────────────────────────────────────────
        async function handleBooking() {
            if (!selectedSeatId) return;

            const btn   = document.getElementById("confirm-btn");
            const msgEl = document.getElementById("booking-message");

            btn.disabled    = true;
            btn.textContent = "Booking...";
            msgEl.classList.add("hidden");

            try {
                const result = await bookSeat(scheduleId, selectedSeatId);

                // Show success
                msgEl.className   = "text-center text-sm mt-3 py-2 px-4 rounded-lg bg-green-50 text-green-600 border border-green-200";
                msgEl.innerHTML   = `<i class="fa-solid fa-circle-check mr-2"></i>Booking confirmed! PNR: <strong>${result.pnr}</strong>`;
                msgEl.classList.remove("hidden");

                btn.textContent = "Booked!";

                // ✅ Redirect to my_bookings with PNR and booking_id in URL
                setTimeout(function() {
                       window.location.href = "/my-bookings?pnr=" + result.pnr +
                                   "           &booking_id="      + result.booking_id;
                }, 1500);

            } catch (err) {
                msgEl.className   = "text-center text-sm mt-3 py-2 px-4 rounded-lg bg-red-50 text-red-600 border border-red-200";
                msgEl.innerHTML   = `<i class="fa-solid fa-circle-exclamation mr-2"></i>${err.error || err.message || "Booking failed. Please try again."}`;
                msgEl.classList.remove("hidden");
                btn.disabled    = false;
                btn.textContent = "Confirm Booking";
            }
        }

    </script>
</body>
</html>
