<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Select Seats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f0f4f8] font-sans min-h-screen pb-20">

    <header class="bg-white px-8 py-4 flex justify-between items-center border-b sticky top-0 z-50">
        <h1 class="text-blue-700 font-bold text-xl">TransitFlow</h1>
        <div class="text-blue-600 text-2xl cursor-pointer">
            <i class="fa-regular fa-circle-user"></i>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-6">
        
        <div class="flex flex-col md:flex-row gap-4">
            <div class="flex-grow bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">Express Liner 402</h2>
                    <p class="text-xs text-gray-400 font-bold tracking-widest mt-1">LUXURY SLEEPER CLASS</p>
                    <div class="mt-4 flex items-center gap-2 text-sm text-gray-600">
                        <i class="fa-regular fa-clock"></i>
                        <span>09:30 PM - 05:45 AM</span>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-bold text-blue-600">90.00</p>
                    <p class="text-[10px] text-gray-400 font-bold">Per Seat</p>
                </div>
            </div>
            
            <div class="bg-blue-600 text-white p-6 rounded-2xl shadow-lg flex flex-col items-center justify-center min-w-[180px]">
                <i class="fa-solid fa-bus text-2xl mb-2"></i>
                <p class="text-[10px] uppercase font-bold opacity-80">Platform</p>
                <p class="text-xl font-bold">Gate B-12</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-sm font-bold text-gray-700 mb-4">Seat Legend</p>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-200 rounded"></div> Available
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-gray-200 rounded"></div> Booked
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-pink-100 border border-pink-200 flex items-center justify-center text-pink-500">
                        <i class="fa-solid fa-venus text-[10px]"></i>
                    </div> Women
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-blue-500 flex items-center justify-center text-blue-500">
                        <i class="fa-solid fa-wheelchair text-[10px]"></i>
                    </div> PWD
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-400 rounded"></div> Window
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-blue-600 rounded flex items-center justify-center text-white">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div> Selected
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl border border-gray-100 max-w-sm mx-auto overflow-hidden">
            <div class="bg-gray-100 p-6 flex justify-between items-center border-b border-gray-200">
                <div class="w-10 h-10 rounded-full border-4 border-gray-400 flex items-center justify-center">
                    <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                </div>
                <span class="text-[10px] font-bold text-gray-400 tracking-widest">FRONT</span>
            </div>

            <div class="p-8 grid grid-cols-4 gap-x-4 gap-y-6 place-items-center">
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500 hover:border-blue-500 transition">1A</button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500 hover:border-blue-500 transition">1B</button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500 hover:border-blue-500 transition">1C</button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500 hover:border-blue-500 transition">1D</button>

                <button class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-blue-200">
                    <i class="fa-solid fa-check text-sm"></i>
                </button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">2B</button>
                <div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xs font-bold">2C</div> <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">2D</button>

                <button class="w-12 h-12 bg-pink-100 border border-pink-200 rounded-lg flex items-center justify-center text-pink-500">
                    <i class="fa-solid fa-venus"></i>
                </button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">3B</button>
                <button class="w-12 h-12 border-2 border-blue-500 rounded-lg flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-wheelchair"></i>
                </button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">3D</button>

                <div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xs font-bold">4A</div>
                <div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xs font-bold">4B</div>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">4C</button>
                <button class="w-12 h-12 border-2 border-gray-300 rounded-lg text-xs font-bold text-gray-500">4D</button>
            </div>
            
            <div class="flex justify-center pb-8">
                <div class="w-24 h-2 bg-gray-100 rounded-full"></div>
            </div>
        </div>
    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full py-3 flex justify-around items-center z-50">
        <div class="flex flex-col items-center text-blue-600 cursor-pointer" onclick="location.href='search.html'">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600" onclick="location.href='profile.html'">
            <i class="fa-regular fa-user text-xl"></i>
            <span class="text-[10px] mt-1">PROFILE</span>
        </div>
    </nav>

</body>
</html>
