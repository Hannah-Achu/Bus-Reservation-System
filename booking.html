<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Select Seats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f0f4f8] font-sans min-h-screen pb-20">

    <header class="bg-white px-8 py-4 flex justify-between items-center border-b sticky top-0 z-50">
        <h1 class="text-blue-700 font-bold text-xl">TransitFlow</h1>
        <div class="text-blue-600 text-2xl cursor-pointer hover:text-blue-600"
             onclick="location.href='/profile'">
            <i class="fa-regular fa-circle-user"></i>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-6">

        <div class="flex flex-col md:flex-row gap-4">
            <div class="flex-grow bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <h2 id="bus-number" class="text-xl font-bold text-gray-800">Loading...</h2>
                    <p id="bus-type" class="text-xs text-gray-400 font-bold tracking-widest mt-1"></p>
                    <div class="mt-4 flex items-center gap-2 text-sm text-gray-600">
                        <i class="fa-regular fa-clock"></i>
                        <span id="departure-time">--</span>
                    </div>
                    <p id="route-name" class="text-sm text-gray-500 mt-1"></p>
                </div>
                <div class="text-right">
                    <p id="fare" class="text-2xl font-bold text-blue-600">--</p>
                    <p class="text-[10px] text-gray-400 font-bold">Per Seat</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-sm font-bold text-gray-700 mb-4">Seat Legend</p>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-2">
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-200 rounded"></div> Available
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-gray-200 rounded"></div> Booked
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-pink-100 border border-pink-200 flex items-center justify-center text-pink-500">
                        <i class="fa-solid fa-venus text-[10px]"></i>
                    </div> Women
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-blue-500 flex items-center justify-center text-blue-500">
                        <i class="fa-solid fa-wheelchair text-[10px]"></i>
                    </div> PWD
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 border-2 border-gray-400 rounded"></div> Window
                </div>
                <div class="flex items-center gap-3 text-xs text-gray-600">
                    <div class="w-5 h-5 bg-blue-600 rounded flex items-center justify-center text-white">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div> Selected
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl border border-gray-100 max-w-sm mx-auto overflow-hidden">
            <div class="bg-gray-100 p-6 flex justify-between items-center border-b border-gray-200">
                <div class="w-10 h-10 rounded-full border-4 border-gray-400 flex items-center justify-center">
                    <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
                </div>
                <span class="text-[10px] font-bold text-gray-400 tracking-widest">FRONT</span>
            </div>

            <div id="seat-grid" class="p-8 grid grid-cols-4 gap-x-4 gap-y-6 place-items-center">
                <p class="col-span-4 text-gray-400 text-sm">Loading seats...</p>
            </div>

            <div class="flex justify-center pb-8">
                <div class="w-24 h-2 bg-gray-100 rounded-full"></div>
            </div>
        </div>

        <div id="booking-summary" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-sm font-bold text-gray-700 mb-3">Booking Summary</h3>
            <div class="flex justify-between text-sm text-gray-600 mb-2">
                <span>Selected Seat</span>
                <span id="summary-seat" class="font-bold text-gray-800">--</span>
            </div>
            <div class="flex justify-between text-sm text-gray-600 mb-2">
                <span>Seat Type</span>
                <span id="summary-type" class="font-bold text-gray-800">--</span>
            </div>
            <div class="flex justify-between text-sm text-gray-600 mb-4">
                <span>Total Fare</span>
                <span id="summary-fare" class="font-bold text-blue-600 text-lg">--</span>
            </div>
            <button onclick="handleBooking()"
                class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                Confirm Booking
            </button>
            <p id="booking-message" class="text-center text-sm mt-3"></p>
        </div>

    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full py-3 flex justify-around items-center z-50">
        <div class="flex flex-col items-center text-blue-600 cursor-pointer"
             onclick="location.href='/search'">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600"
             onclick="location.href='/profile'">
            <i class="fa-regular fa-user text-xl"></i>
            <span class="text-[10px] mt-1">PROFILE</span>
        </div>
    </nav>

    <script src="/static/js/api.js"></script>
    <script>
        // ── Get schedule_id and bus_id passed from the search page via URL
        // e.g. /select-seats?schedule_id=1&bus_id=1
        const params     = new URLSearchParams(window.location.search);
        const scheduleId = parseInt(params.get("schedule_id"));
        const busId      = parseInt(params.get("bus_id"));

        let selectedSeatId  = null;   // tracks which seat the user clicked
        let selectedSeatNo  = null;
        let selectedSeatType = null;
        let currentFare     = 0;

        // ── Load schedule info and seats when page opens ──────────────
        window.addEventListener("load", async () => {
            if (!scheduleId || !busId) {
                document.getElementById("seat-grid").innerHTML =
                    `<p class="col-span-4 text-red-400 text-sm">
                        No schedule selected. <a href="/search" class="underline">Go back</a>
                    </p>`;
                return;
            }
            await loadScheduleInfo();
            await loadSeats();
        });

        // ── Fetch and display bus/schedule info ───────────────────────
        async function loadScheduleInfo() {
            try {
                // Search returns schedule info — we reuse searchSchedules
                // Or fetch all schedules and find by ID
                const res = await fetch(/api/buses/schedule/${scheduleId});
                const s   = await res.json();

                document.getElementById("bus-number").textContent  = s.bus_number;
                document.getElementById("bus-type").textContent    = s.bus_type;
                document.getElementById("departure-time").textContent =
                    new Date(s.departure).toLocaleString();
                document.getElementById("route-name").textContent  = s.route;
                document.getElementById("fare").textContent        = ₹${s.fare};
                currentFare = s.fare;
            } catch (err) {
                console.error("Could not load schedule info", err);
            }
        }

        // ── Fetch and render the seat grid ────────────────────────────
        async function loadSeats() {
            const grid = document.getElementById("seat-grid");
            try {
                const seats = await getSeats(busId);   // from api.js
                if (seats.length === 0) {
                    grid.innerHTML = <p class="col-span-4 text-gray-400">No seats found.</p>;
                    return;
                }
                grid.innerHTML = seats.map(seat => buildSeatButton(seat)).join("");
            } catch (err) {
                grid.innerHTML = <p class="col-span-4 text-red-400">Failed to load seats.</p>;
            }
        }

        // ── Build each seat button based on its status/restriction ────
        function buildSeatButton(seat) {
            // Booked — grey, not clickable
            if (seat.status === "Booked") {
                return `
                    <div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center
                                justify-center text-gray-400 text-xs font-bold"
                         title="Booked">
                        ${seat.seat_no}
                    </div>`;
            }

            // Women restricted seat
            if (seat.restriction === "Women") {
                return `
                    <button onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                        class="w-12 h-12 bg-pink-100 border border-pink-200 rounded-lg
                               flex items-center justify-center text-pink-500
                               hover:border-pink-400 transition"
                        title="Women only - ${seat.seat_no}">
                        <i class="fa-solid fa-venus"></i>
                    </button>`;
            }

            // PWD restricted seat
            if (seat.restriction === "PWD") {
                return `
                    <button onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                        class="w-12 h-12 border-2 border-blue-500 rounded-lg
                               flex items-center justify-center text-blue-600
                               hover:bg-blue-50 transition"
                        title="PWD - ${seat.seat_no}">
                        <i class="fa-solid fa-wheelchair"></i>
                    </button>`;
            }

            // Window seat
            if (seat.seat_type === "Window") {
                return `
                    <button id="seat-${seat.seat_id}"
                        onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                        class="w-12 h-12 border-2 border-gray-400 rounded-lg
                               text-xs font-bold text-gray-500
                               hover:border-blue-500 transition"
                        title="Window - ${seat.seat_no}">
                        ${seat.seat_no}
                    </button>`;
            }

            // Standard available seat
            return `
                <button id="seat-${seat.seat_id}"
                    onclick="selectSeat(${seat.seat_id}, '${seat.seat_no}', '${seat.seat_type}')"
                    class="w-12 h-12 border-2 border-gray-300 rounded-lg
                           text-xs font-bold text-gray-500
                           hover:border-blue-500 transition"
                    title="${seat.seat_no}">
                    ${seat.seat_no}
                </button>`;
        }

        // ── Handle seat click ─────────────────────────────────────────
        function selectSeat(seatId, seatNo, seatType) {
            // Deselect previous seat visually
            if (selectedSeatId) {
                const prev = document.getElementById(seat-${selectedSeatId});
                if (prev) {
                    prev.classList.remove("bg-blue-600", "text-white", "shadow-md");
                    prev.classList.add("border-2", "border-gray-300", "text-gray-500");
                    prev.innerHTML = selectedSeatNo;
                }
            }

            // Select new seat
            selectedSeatId   = seatId;
            selectedSeatNo   = seatNo;
            selectedSeatType = seatType;

            const btn = document.getElementById(seat-${seatId});
            if (btn) {
                btn.classList.remove("border-2", "border-gray-300", "text-gray-500");
                btn.classList.add("bg-blue-600", "text-white", "shadow-md");
                btn.innerHTML = <i class="fa-solid fa-check text-sm"></i>;
            }

            // Show booking summary
            document.getElementById("booking-summary").classList.remove("hidden");
            document.getElementById("summary-seat").textContent = seatNo;
            document.getElementById("summary-type").textContent = seatType;
            document.getElementById("summary-fare").textContent = ₹${currentFare};
        }

        // ── Confirm booking via api.js ────────────────────────────────
        async function handleBooking() {
            if (!selectedSeatId) return;
            const msg = document.getElementById("booking-message");
            try {
                const result = await bookSeat(scheduleId, selectedSeatId);  // api.js
                msg.style.color   = "green";
                msg.textContent   = ✅ Booked! PNR: ${result.pnr};
                // Reload seats to reflect the newly booked seat
                setTimeout(() => {
                    loadSeats();
                    document.getElementById("booking-summary").classList.add("hidden");
                    selectedSeatId = null;
                }, 2000);
            } catch (err) {
                msg.style.color = "red";
                msg.textContent = ❌ ${err.error || "Booking failed"};
            }
        }
    </script>

</body>
</html>
