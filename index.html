<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b px-6 py-3 flex justify-between items-center fixed top-0 w-full z-50">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-bars text-blue-600 text-xl cursor-pointer"></i>
            <h1 class="text-blue-700 font-bold text-xl tracking-tight">TransitFlow</h1>
        </div>
        <div class="text-blue-600 text-2xl cursor-pointer">
            <i class="fa-regular fa-circle-user"></i>
        </div>
    </header>

    <main class="flex-grow pt-14 pb-20 relative flex justify-center items-start md:items-center">
        <div class="absolute top-0 left-0 w-full h-64 md:h-80 bg-cover bg-center z-0"
             style="background-image: url('assets/bus.jpeg');">
            <div class="w-full h-full bg-black/10"></div>
        </div>

        <div class="relative z-10 bg-white w-full max-w-md mx-4 mt-20 md:mt-10 rounded-2xl shadow-2xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Create your account</h2>
                <p class="text-gray-500 text-sm mt-2">Join us for a seamless travel experience</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Gender</label>
                    <select id="gender"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-white">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Do you have a disability?</label>
                    <select id="pwd_status"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-white">
                        <option value="false">No</option>
                        <option value="true">Yes (PWD)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+1 (555) 000-0000"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" placeholder="Create a strong password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    <button type="button" onclick="togglePassword()"
                            class="absolute right-4 top-10 text-gray-400 hover:text-gray-600">
                        <i id="eye-icon" class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <!-- Error/success message display -->
                <div id="message" class="hidden text-sm text-center font-semibold py-2 px-4 rounded-lg"></div>

                <!-- onclick calls handleRegister() instead of form submit -->
                <button onclick="handleRegister()"
                        id="submit-btn"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-lg transition-all transform active:scale-[0.98]">
                    Create Account
                </button>
            </div>

            <div class="text-center mt-6">
                <p class="text-sm text-gray-600">
                    Already have an account?
                    <a href="/login" class="text-blue-700 font-bold hover:underline">Log In</a>
                </p>
            </div>
        </div>
    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full py-2 flex justify-around items-center z-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-blue-600"
             onclick="location.href='/search'">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] mt-1">Search</span>
        </div>
        <div class="flex flex-col items-center text-blue-700 cursor-pointer bg-blue-50 px-6 py-1 rounded-2xl">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">Profile</span>
        </div>
    </nav>

    <!-- api.js loaded first, then page logic -->
    <script src="/static/js/api.js"></script>
    <script>

        // ── Show/hide password ────────────────────────────────────────
        function togglePassword() {
            const input   = document.getElementById("password");
            const icon    = document.getElementById("eye-icon");
            const isHidden = input.type === "password";
            input.type    = isHidden ? "text" : "password";
            icon.className = isHidden ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
        }

        // ── Show feedback message ─────────────────────────────────────
        function showMessage(text, isError = false) {
            const msg = document.getElementById("message");
            msg.textContent   = text;
            msg.className     = `text-sm text-center font-semibold py-2 px-4 rounded-lg ${
                isError
                ? "bg-red-50 text-red-600 border border-red-200"
                : "bg-green-50 text-green-600 border border-green-200"
            }`;
            msg.classList.remove("hidden");
        }

        // ── Validate inputs before sending ───────────────────────────
        function validate(name, email, phone, password) {
            if (!name.trim())                      return "Full name is required";
            if (!email.trim())                     return "Email is required";
            if (!email.includes("@"))              return "Enter a valid email address";
            if (!phone.trim())                     return "Phone number is required";
            if (password.length < 4)               return "Password must be at least 4 characters";
            return null;   // no errors
        }

        // ── Main register function called by the button ───────────────
        async function handleRegister() {
            const name       = document.getElementById("name").value;
            const gender     = document.getElementById("gender").value;
            const pwd_status = document.getElementById("pwd_status").value === "true";
            const email      = document.getElementById("email").value;
            const phone      = document.getElementById("phone").value;
            const password   = document.getElementById("password").value;
            const btn        = document.getElementById("submit-btn");

            // Validate first
            const error = validate(name, email, phone, password);
            if (error) { showMessage(error, true); return; }

            // Disable button while request is in flight
            btn.disabled    = true;
            btn.textContent = "Creating account...";

            try {
                // Calls register() from api.js
                await register(name, gender, pwd_status, email, password, phone);
                showMessage("Account created! Redirecting to login...");
                setTimeout(() => window.location.href = "/login", 1500);
            } catch (err) {
                showMessage(err.error || "Registration failed. Please try again.", true);
                btn.disabled    = false;
                btn.textContent = "Create Account";
            }
        }

        // ── Allow pressing Enter to submit ────────────────────────────
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleRegister();
        });

    </script>
</body>
</html>
